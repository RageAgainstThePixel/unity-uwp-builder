name: validate
on:
  schedule:
    - cron: '0 8 7 * *' # monthly: the older editors, which no longer change
  push:
    branches: ['main']
  pull_request:
    branches: ['*']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
    inputs:
      editors:
        description: Which editors to test
        type: choice
        options: [unity-6-and-newer, legacy]
        default: unity-6-and-newer
concurrency:
  # the monthly legacy run gets its own group, so a push to main does not cancel it
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'legacy' || inputs.editors || 'unity-6-and-newer' }}
  cancel-in-progress: true
jobs:
  setup:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    # pull requests and pushes test the streams Unity lists; the older editors run monthly or on demand
    uses: RageAgainstThePixel/workflows/.github/workflows/unity-stream-matrix.yml@main
    with:
      legacy: ${{ inputs.editors == 'legacy' }}
  # every row is a Windows runner, a new machine every job, so each row activates with the account and returns the
  # license; there is no shared run license to hand out
  validate:
    if: ${{ needs.setup.outputs.jobs }}
    needs: setup
    name: build ${{ matrix.jobs.name }}
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
      fail-fast: false
    secrets: inherit
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ toJSON(matrix.jobs.matrix) }}
      allow-security-alert: ${{ needs.setup.outputs.allow-security-alert == 'true' }}
  # the one required check: row names follow the streams Unity lists, so the ruleset can't name them
  ci-result:
    needs: [setup, validate]
    # skipped with the rest on a draft, rather than green with nothing tested
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SETUP_RESULT: ${{ needs.setup.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error::At least one job ended with ${result}"
              exit 1
            fi
          done
          # the matrix must actually have run: an empty or skipped matrix would otherwise pass with no tests
          if [ "${SETUP_RESULT}" != "success" ] || [ "${VALIDATE_RESULT}" != "success" ]; then
            echo "::error::No Unity rows ran (setup: ${SETUP_RESULT}, validate: ${VALIDATE_RESULT})"
            exit 1
          fi
  timeline:
    needs: [setup, validate]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
